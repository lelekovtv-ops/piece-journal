<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>журнал piece</title>
  <meta name="description" content="Рукописный журнал проекта piece — что сделали, что нашли, что поняли." />
  <meta name="theme-color" content="#15120f" />

  <!-- installable app (Add to Home Screen on iPhone / Android) -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="журнал" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Marck+Script&family=JetBrains+Mono&display=swap"
    rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="topbar">
    <button class="pill pill--date" id="date-btn" aria-haspopup="true" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="16" rx="2.5"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></svg>
      <span id="counter">обложка</span>
    </button>
    <div class="date-pop" id="date-pop">
      <div class="date-pop-head">
        <span>Перейти к дате</span>
        <input type="date" id="date-input" />
      </div>
      <div class="date-list" id="date-list"></div>
      <div class="date-pop-foot" id="date-foot"></div>
    </div>
  </div>

  <button class="nav nav--prev" id="prev" aria-label="Назад">‹</button>
  <button class="nav nav--next" id="next" aria-label="Вперёд">›</button>

  <div class="viewport">
    <div class="book" id="book">
      <div class="stage" id="stage"></div>
    </div>
  </div>

  <div class="progress" id="progress"></div>

  <!-- writing & drawing tools -->
  <div class="tools" id="tools">
    <button class="tool active" data-tool="flip" title="Листать" aria-label="Листать">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6c-2-1.3-4.6-1.7-7-1v12.5c2.4-.7 5-.3 7 1 2-1.3 4.6-1.7 7-1V5c-2.4-.7-5-.3-7 1z"/><path d="M12 6v12.5"/></svg>
    </button>
    <button class="tool" data-tool="pen" title="Писать рукой" aria-label="Писать">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4l5 5L9 20l-5 1 1-5L15 4z"/><path d="M13.5 5.5l5 5"/></svg>
    </button>
    <button class="tool" data-tool="marker" title="Фломастер" aria-label="Фломастер">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h6"/><path d="M9 16l7-7 3 3-7 7H9v-3z"/><path d="M14 7l3-3 3 3-3 3"/></svg>
    </button>
    <button class="tool" data-tool="eraser" title="Стереть" aria-label="Стереть">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 15l6-6 7 7-4 4H8l-3-3v-2z"/><path d="M10 20h9"/></svg>
    </button>
    <div class="tool-colors" id="tool-colors"></div>
    <span class="tool-sep"></span>
    <button class="tool" id="tool-undo" title="Отменить" aria-label="Отменить">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7L4 12l5 5"/><path d="M4 12h10a6 6 0 0 1 0 12"/></svg>
    </button>
    <button class="tool" id="tool-addpage" title="Чистый лист" aria-label="Чистый лист">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>

  <button class="fab" id="fab" aria-label="Записать">
    <span aria-hidden="true">✎</span>
    <span>Записать</span>
  </button>

  <!-- composer -->
  <div class="composer-backdrop" id="composer-backdrop">
    <div class="composer" role="dialog" aria-modal="true" aria-label="Новая запись">
      <h2>Новая запись</h2>
      <div class="row">
        <div class="col">
          <label for="c-author">Автор</label>
          <select id="c-author">
            <option value="alex">Алекс</option>
            <option value="claude">Claude</option>
            <option value="codex">Codex</option>
          </select>
        </div>
        <div class="col" style="flex: 2">
          <label for="c-title">Заголовок</label>
          <input id="c-title" type="text" placeholder="например: запустили блокнот" />
        </div>
      </div>
      <label for="c-body">Что сделали / что нашли</label>
      <textarea id="c-body" placeholder="Пиши простыми словами, как себе в тетрадь…"></textarea>
      <div class="actions">
        <button class="btn btn--ghost" id="c-cancel">Отмена</button>
        <button class="btn btn--primary" id="c-save">Сохранить</button>
        <button class="btn btn--gh" id="c-github">Добавить в журнал на GitHub</button>
      </div>
      <div class="hint">
        «Сохранить» — запись появится сразу на этом устройстве (черновик).
        «Добавить на GitHub» — откроет готовый файл, останется нажать Commit,
        и запись увидят все.
      </div>
    </div>
  </div>

  <div class="flash" id="flash"></div>

  <script src="app.js"></script>
</body>
</html>
